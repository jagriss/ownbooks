[workspace]
name = "ownbooks"
version = "0.1.0"
description = "Personal finance that never leaves your laptop: bank CSVs -> dlt -> DuckDB -> dbt -> Streamlit"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

# Loads .env (if present) and sets path defaults for every task. The
# defaults live in the script because pixi's [activation.env] table
# overwrites variables already set in the shell; the script keeps a
# shell override such as `FINANCE_DUCKDB_PATH=... pixi run app`.
[activation]
scripts = ["scripts/activate-env.sh"]

[tasks]
# Day to day: `pixi run app` -- everything else is in the app. Tasks
# whose names start with "_" are plumbing, hidden from `pixi task list`.
app = { cmd = "streamlit run app/app.py", description = "Open the finance app (http://localhost:8501, this machine only)" }
refresh = { cmd = "python -m ingest.refresh", description = "Load new statements and rebuild, on a copy swapped in only if tests pass (--models: rebuild only)" }
# Read-only so they never conflict with a refresh, which builds on a
# copy and swaps it in; reopen them to see data from a newer refresh.
sql = { cmd = """duckdb -readonly "$FINANCE_DUCKDB_PATH" """, description = "Read-only DuckDB shell on the warehouse" }
ui = { cmd = """duckdb -readonly -cmd "INSTALL ui; LOAD ui; CALL start_ui();" "$FINANCE_DUCKDB_PATH" """, description = "Read-only DuckDB notebook UI (http://localhost:4213)" }
# Synthetic data, never real: dummy-data writes dummy_*.csv into
# data/statements; demo runs the fixtures into data/demo.duckdb.
dummy-data = { cmd = "python scripts/generate_dummy_statements.py", description = "Write a year of synthetic statements to data/statements" }
demo = { cmd = """
export FINANCE_STATEMENTS_ROOT=$PIXI_PROJECT_ROOT/tests/fixtures/statements &&
export FINANCE_DUCKDB_PATH=$PIXI_PROJECT_ROOT/data/demo.duckdb &&
python -m ingest.refresh
""", description = "Run the pipeline on test fixtures into data/demo.duckdb" }
test = { cmd = "python -m unittest discover -s tests -t .", description = "Run unit tests" }
# Data-leak guard: `install-hooks` makes git run it on every commit
# (once per clone); `check-private` scans everything already tracked.
install-hooks = { cmd = "git config core.hooksPath .githooks", description = "Enable the commit-time data-leak check (once per clone)" }
check-private = { cmd = "python scripts/check_private_data.py --all", description = "Scan tracked files for financial data or personal identifiers" }
fmt = { cmd = "black ingest tests app scripts && isort ingest tests app scripts", description = "Format Python" }
lint-sql = { cmd = "sqlfluff lint transform/models transform/tests", description = "Lint dbt SQL" }

# Plumbing. These write to the LIVE database directly, bypassing the
# copy-and-swap -- for debugging only; use `refresh`.
# dbt here is the Fusion engine CLI (the "dbt" PyPI package, not
# dbt-core); --profiles-dir is explicit since Fusion doesn't honor
# DBT_PROFILES_DIR.
_ingest = "python -m ingest.pipelines.run_bank_csv"
_dbt-build = "dbt build --project-dir transform --profiles-dir transform"
_dbt-docs = "dbt docs generate --project-dir transform --profiles-dir transform"

# Conda dependencies, resolved together by the conda-forge solver
# (pixi.lock pins the exact builds that make an environment
# reproducible).
[dependencies]
python = "3.12.*"
duckdb = ">=1.1,<2"        # local warehouse; also used directly from Python
duckdb-cli = ">=1.1,<2"    # `duckdb` shell for the sql/ui tasks
dlt = ">=1.4,<2"           # data ingestion framework
sqlfluff = ">=3.1,<4"
black = ">=24.8,<26"
isort = ">=5.13,<7"
streamlit = ">=1.46,<2"

# PyPI dependencies: the "dbt" package (not dbt-core) is the dbt
# Fusion engine CLI -- a pre-release, not yet published on conda-forge.
[pypi-dependencies]
dbt = ">=2.0.0rc200, <3"
