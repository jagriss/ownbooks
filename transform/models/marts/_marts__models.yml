version: 2

models:
  - name: fct_transactions
    description: >
      One row per transaction across all accounts: cleaned, categorized
      by seeds/merchant_rules.csv, and with transfers between your own
      accounts paired.
    columns:
      - name: txn_id
        description: Stable transaction key from ingestion.
        tests:
          - not_null
          - unique
      - name: account_key
        description: Account the transaction belongs to.
        tests:
          - relationships:
              arguments:
                to: ref('accounts')
                field: account_key
      - name: category
        description: >
          Category from the matched rule, else the bank's own category
          mapped via seeds/bank_category_map.csv, else 'Uncategorized'.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('categories')
                field: category
      - name: category_source
        description: Where category came from -- rule, bank, or none.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["rule", "bank", "none"]
      - name: amount
        description: Signed amount; negative is money out.
        tests:
          - not_null
      - name: spend_amount
        description: >
          -amount for spend categories (positive = spent), NULL for
          income and transfers.
      - name: transfer_matched_txn_id
        description: >
          For transfers, the txn_id of the other side of the movement.
  - name: dim_merchants
    description: One row per merchant with lifetime spend.
    columns:
      - name: merchant_name
        tests:
          - not_null
          - unique
  - name: mart_monthly_spend
    description: Net spend by month and category, excluding transfers and income.
  - name: mart_subscriptions
    description: >
      Merchants charging a near-constant amount roughly monthly, with
      the next expected charge date and annualized cost.
  - name: mart_uncategorized
    description: >
      Descriptions no merchant rule covers, ranked by money involved --
      the list of rules to write next. bank_guess is the category the
      bank-category fallback assigned, if any.
