version: 2

sources:
  - name: raw_bank
    description: >
      Raw statement rows loaded by the dlt `bank_csv` pipeline
      (ingest/sources/bank_csv.py), one table per export layout. Every
      original column is kept as text under its snake_cased header name;
      typing and sign normalization happen in the staging models. Each
      table's columns are frozen by a dlt schema contract, so a bank
      changing its export format fails the load with an error naming
      the new column.
    schema: raw_bank
    tables:
      - name: chase_checking
        description: Chase checking account exports, one row per transaction.
        columns: &metadata_columns
          - name: txn_hash
            description: >
              SHA-256 of (account_key, date, description, amount,
              occurrence_n); the transaction's stable key. Rows are
              merged on it, so overlapping exports don't duplicate.
          - name: account_key
            description: >
              Statement subfolder the file was in; joins to the accounts
              seed.
          - name: occurrence_n
            description: >
              1-based count of identical rows within the source file,
              so genuine same-day duplicates stay distinct.
          - name: source_file
            description: >
              CSV the row was read from, relative to the statements
              root, e.g. chase_checking/Chase1234_Activity.csv.
          - name: source_line
            description: Line number of the row within source_file.
          - name: extracted_at
            description: UTC timestamp the row was parsed.
      - name: chase_card
        description: Chase credit card exports, one row per transaction.
        columns: *metadata_columns
      - name: amex
        description: >
          Amex exports (basic or extended), one row per transaction.
          Extended-export columns are null for rows from basic exports.
        columns: *metadata_columns
