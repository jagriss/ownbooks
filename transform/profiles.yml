# Kept alongside the dbt project (--profiles-dir points here via
# pixi.toml) so the whole ELT stack is self-contained in one checkout. DuckDB needs no credentials, so this
# file holds no secrets.
finance:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('FINANCE_DUCKDB_PATH') }}"
      threads: 4
